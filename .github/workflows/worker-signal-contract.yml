name: Worker signal contract tests

on:
  pull_request:
    paths:
      - 'worker/src/**'
      - 'worker/tests/**'
      - 'worker/scripts/smoke-check.mjs'
      - 'scripts/rehearse-paper-worker.sh'
      - 'worker/migrations/**'
      - 'worker/scripts/verify-live-candidate-migrations.mjs'
      - 'worker/scripts/run-bitget-actions-readonly.mjs'
      - 'worker/scripts/verify-bitget-actions-readonly-safety.mjs'
      - 'worker/scripts/verify-bitget-v3-private-certification-safety.mjs'
      - '.github/workflows/bitget-uta-readonly-certification.yml'
      - 'worker/package.json'
      - 'worker/package-lock.json'
      - 'worker/vitest.config.ts'
      - 'wrangler.toml'
      - 'wrangler.provider-certification.toml'
      - 'scripts/verify-cloudflare-token-scope*.mjs'
      - '.github/workflows/worker-signal-contract.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/self-hosted-release.yml'
  push:
    branches: [main]
    paths:
      - 'worker/src/**'
      - 'worker/tests/**'
      - 'worker/scripts/smoke-check.mjs'
      - 'scripts/rehearse-paper-worker.sh'
      - 'worker/migrations/**'
      - 'worker/scripts/verify-live-candidate-migrations.mjs'
      - 'worker/scripts/run-bitget-actions-readonly.mjs'
      - 'worker/scripts/verify-bitget-actions-readonly-safety.mjs'
      - 'worker/scripts/verify-bitget-v3-private-certification-safety.mjs'
      - '.github/workflows/bitget-uta-readonly-certification.yml'
      - 'worker/package.json'
      - 'worker/package-lock.json'
      - 'worker/vitest.config.ts'
      - 'wrangler.toml'
      - 'wrangler.provider-certification.toml'
      - 'scripts/verify-cloudflare-token-scope*.mjs'
      - '.github/workflows/worker-signal-contract.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/self-hosted-release.yml'

permissions:
  contents: read

jobs:
  signal-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install Worker dependencies
        run: npm --prefix worker ci
      - name: Type-check Worker
        run: npm --prefix worker run build
      - name: Run Worker contract tests
        run: npm exec -- vitest run -c worker/vitest.config.ts
      - name: Verify paper-only safety
        run: npm --prefix worker run verify:paper-safety
      - name: Verify Bitget certification without credentials
        working-directory: worker
        run: |
          node scripts/verify-bitget-actions-readonly-safety.mjs
          node scripts/verify-bitget-v3-private-certification-safety.mjs
          node --experimental-sqlite --experimental-strip-types --no-warnings --test tests/live-bitget-actions-readonly.test.ts
      - name: Rehearse recovery, accounting, and settlement
        working-directory: worker
        run: |
          npm run test:live-foundation
          npm run verify:migrations
      - name: Verify production smoke checker failure handling
        run: node --test worker/tests/paper-smoke-fail-closed.test.mjs
      - name: Verify deployment and attestation failure handling
        run: node --test tests/deployed-paper-verifier*.test.mjs tests/production-attestation-behavior.test.mjs
      - name: Verify Cloudflare release preflight
        run: node --test scripts/verify-cloudflare-token-scope.test.mjs
      - name: Build paper and provider certification Worker bundles
        working-directory: worker
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          ./node_modules/.bin/wrangler deploy --dry-run --config ../wrangler.toml --outdir "$RUNNER_TEMP/gem-paper-worker"
          ./node_modules/.bin/wrangler deploy --dry-run --config ../wrangler.provider-certification.toml --outdir "$RUNNER_TEMP/gem-provider-worker"
      - name: Rehearse paper deployment against local D1
        run: bash scripts/rehearse-paper-worker.sh
